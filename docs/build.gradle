plugins {
    id 'strata-mc-java'
    // Vanilla classes for the examples
    id 'net.neoforged.moddev'
}

description = 'The code the Minecraft documentation shows, compiled so every example stays correct.'

neoForge {
    neoFormVersion = neo_form_version
}

dependencies {
    // What a mod compiles against
    implementation("org.inspirenxe:strata-api:${strata_version}")
    compileOnly(project(':common')) {
        attributes {
            attribute(Attribute.of('io.github.mcgradleconventions.loader', String), 'common')
        }
    }
}
