pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven {
            name = 'NeoForged'
            url = uri('https://maven.neoforged.net/releases')
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'Strata-Minecraft'
includeBuild('build-logic')

// Strata itself, built from the sibling checkout until it is published. strataDir in gradle.properties or on the
// command line (-PstrataDir=...) names another checkout, such as a worktree of Strata's java17 branch.
includeBuild(providers.gradleProperty('strataDir').getOrElse('../Strata')) {
    dependencySubstitution {
        ['api', 'spi', 'core'].each { name ->
            substitute(module("org.inspirenxe:strata-${name}")).using(project(":${name}"))
        }
    }
}

// Shared vanilla code, plus a thin layer per loader
include('common')
include('forge')
include('fabric')
// The code the documentation shows, compiled so it stays correct
include('docs')
