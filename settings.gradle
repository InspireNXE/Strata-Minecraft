pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven {
            name = 'NeoForged'
            url = uri('https://maven.neoforged.net/releases')
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'Strata-Minecraft'
includeBuild('build-logic')

// Strata itself, from the checkout beside this one when there is one, so changes to it reach the adapter at once.
// strataDir in gradle.properties or on the command line (-PstrataDir=...) names another checkout, such as a worktree
// of Strata's java17 branch. Without a checkout, strata_version comes from Maven Central, as in the publishing
// workflows.
def strataDir = providers.gradleProperty('strataDir').getOrElse('../Strata')
if (file("${strataDir}/settings.gradle").exists()) {
    includeBuild(strataDir) {
        dependencySubstitution {
            ['api', 'spi', 'core'].each { name ->
                substitute(module("org.inspirenxe:strata-${name}")).using(project(":${name}"))
            }
        }
    }
}

// Shared vanilla code, plus a thin layer per loader
include('common')
include('neoforge')
include('forge')
include('fabric')
// Sponge-only code, compiled into the SpongeVanilla plugin, into the NeoForge jar for SpongeNeo and into the Forge jar for SpongeForge
include('sponge')
include('spongevanilla')
