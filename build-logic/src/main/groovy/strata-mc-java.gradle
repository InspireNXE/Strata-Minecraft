// Every Strata-Minecraft project: Java 25, JUnit, shared jar metadata, and publishing to Maven Central. Each project
// also applies strata-mc-documented or strata-mc-loader, which choose what goes in its javadoc jar.
plugins {
    id 'java-library'
    id 'com.vanniktech.maven.publish'
}

base {
    archivesName = "strata-minecraft-${project.name}"
}

repositories {
    mavenCentral()
    // Strata's own snapshots, for builds that take Strata from Central instead of a checkout beside them
    maven {
        name = 'CentralSnapshots'
        url = uri('https://central.sonatype.com/repository/maven-snapshots/')
        mavenContent {
            snapshotsOnly()
            includeGroup('org.inspirenxe')
        }
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

dependencies {
    testImplementation(platform("org.junit:junit-bom:${junit_version}"))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:all', '-Xlint:-serial', '-Xlint:-processing', '-Xlint:-classfile'])
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.withType(Jar).configureEach {
    from(rootProject.files('LICENSE', 'NOTICE')) {
        rename { "${it}_strata" }
    }
    manifest {
        attributes([
                'Implementation-Title'  : base.archivesName.get(),
                'Implementation-Version': project.version,
                'Implementation-Vendor' : mod_author
        ])
    }
}

processResources {
    var expandProps = [
            'version'                      : version,
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'fabric_loader_version'        : fabric_loader_version,
            'mod_id'                       : mod_id,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'license'                      : license,
            'description'                  : project.description ?: rootProject.property('description'),
            'neoforge_version'             : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'forge_version'                : forge_version,
            'forge_loader_version_range'   : forge_loader_version_range,
            'sponge_api_version_range'     : sponge_api_version_range,
            'java_version'                 : java_version
    ]

    filesMatching(['META-INF/neoforge.mods.toml', 'META-INF/mods.toml']) {
        expand expandProps
    }

    filesMatching(['fabric.mod.json', 'META-INF/sponge_plugins.json', 'pack.mcmeta']) {
        expand expandProps.collectEntries { key, value ->
            [(key): value instanceof String ? value.replace('\n', '\\\\n') : value]
        }
    }

    inputs.properties(expandProps)
}

// Snapshots go to Central's snapshot repository and releases to Central itself. The workflows pass the portal token
// and the signing key as Gradle properties (mavenCentralUsername, mavenCentralPassword, signingInMemoryKey and
// signingInMemoryKeyPassword); snapshots are signed only when a key is given.
mavenPublishing {
    publishToMavenCentral()
    signAllPublications()

    pom {
        name = base.archivesName
        description = providers.provider { project.description ?: rootProject.property('description') }
        inceptionYear = '2026'
        url = 'https://github.com/InspireNXE/Strata-Minecraft'
        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                distribution = 'repo'
            }
        }
        developers {
            developer {
                id = 'inspirenxe'
                name = 'InspireNXE'
                url = 'https://github.com/InspireNXE'
            }
        }
        scm {
            url = 'https://github.com/InspireNXE/Strata-Minecraft'
            connection = 'scm:git:https://github.com/InspireNXE/Strata-Minecraft.git'
            developerConnection = 'scm:git:ssh://git@github.com/InspireNXE/Strata-Minecraft.git'
        }
    }
}

afterEvaluate {
    mavenPublishing.coordinates(project.group.toString(), base.archivesName.get(), project.version.toString())
}
