// common and sponge, whose classes mods use directly. Javadoc runs with every doclint check, including missing
// comments, @param, @return and @throws, and any warning fails the build. The published javadoc jar holds it.
import com.vanniktech.maven.publish.JavaLibrary
import com.vanniktech.maven.publish.JavadocJar
import com.vanniktech.maven.publish.SourcesJar

plugins {
    id 'strata-mc-java'
}

mavenPublishing {
    configure(new JavaLibrary(new JavadocJar.Javadoc(), new SourcesJar.Sources()))
}

tasks.named('javadoc', Javadoc) {
    options.encoding = 'UTF-8'
    options.addBooleanOption('Xdoclint:all', true)
    options.addBooleanOption('Werror', true)
}

// Run javadoc with the regular checks, so `gradlew check` catches a missing doc without building jars
tasks.named('check') {
    dependsOn(tasks.named('javadoc'))
}
