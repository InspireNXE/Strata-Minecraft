plugins {
    id 'strata-mc-loader'
    id 'strata-mc-sponge'
    // Vanilla classes to compile common against; SpongeVanilla runs the unobfuscated game as it is
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
}

// Sponge loads each plugin jar as one module and has no nested jars, so Strata's classes go into the plugin jar
configurations {
    shade {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }
    implementation.extendsFrom(shade)
}

dependencies {
    ['api', 'spi', 'core'].each { name ->
        shade("org.inspirenxe:strata-${name}:${strata_version}")
    }

    // The tests read the plugin annotation, which needs SpongeAPI at run time
    testImplementation("org.spongepowered:spongeapi:${sponge_api_version}")
}

tasks.named('jar', Jar) {
    dependsOn(configurations.shade)
    from({ configurations.shade.collect { zipTree(it) } }) {
        exclude('META-INF/MANIFEST.MF')
    }
    // Strata's jars carry the same LICENSE and NOTICE
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'sponge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'sponge')
            }
        }
    }
}
