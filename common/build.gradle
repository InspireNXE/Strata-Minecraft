plugins {
    id 'strata-mc-java'
    id 'strata-mc-documented'
    id 'net.neoforged.moddev'
}

description = 'Minecraft 26.3 adapter for Strata, written against vanilla only.'

neoForge {
    neoFormVersion = neo_form_version
    // The tests run against the real vanilla classes
    addModdingDependenciesTo(sourceSets.test)
}

// Each loader compiles these sources into its own jar
configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}

dependencies {
    // compileOnly: each loader brings Strata itself, nested in its mod jar
    compileOnly("org.inspirenxe:strata-core:${strata_version}")

    testImplementation("org.inspirenxe:strata-core:${strata_version}")
    testImplementation('org.mockito:mockito-core:5.24.0')
}

tasks.named('test', Test) {
    // Mockito attaches its agent at runtime; allow it explicitly instead of relying on the JDK's warning path
    jvmArgs('-XX:+EnableDynamicAgentLoading')
}
