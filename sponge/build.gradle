plugins {
    id 'strata-mc-java'
    id 'strata-mc-documented'
    id 'strata-mc-sponge-api'
    id 'net.neoforged.moddev'
}

description = 'The parts of the Minecraft adapter that need SpongeAPI, shared by NeoForge with SpongeNeo and Forge with SpongeForge.'

neoForge {
    neoFormVersion = neo_form_version
}

// neoforge and forge compile these sources into their own jars, as they do common's
configurations {
    spongeJava {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    spongeJava sourceSets.main.java.sourceDirectories.singleFile
}

dependencies {
    compileOnly(project(':common')) {
        attributes {
            attribute(Attribute.of('io.github.mcgradleconventions.loader', String), 'common')
        }
    }
    compileOnly("org.inspirenxe:strata-core:${strata_version}")

    // The tests run the Sponge-backed stack over a stand-in for Sponge's manager
    testImplementation("org.spongepowered:spongeapi:${sponge_api_version}")
    testImplementation("org.inspirenxe:strata-api:${strata_version}")
}
