plugins {
    // see https://maven.fabricmc.net/net/fabricmc/fabric-loom-remap/net.fabricmc.fabric-loom-remap.gradle.plugin/maven-metadata.xml
    // 1.20.1 ships obfuscated, so Fabric needs the Loom that remaps
    id 'net.fabricmc.fabric-loom-remap' version '1.18.4' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle; its legacy plugin builds Forge 1.20.1 and gives common
    // vanilla 1.20.1 with Mojang's names
    id 'net.neoforged.moddev.legacyforge' version '2.0.148' apply false
}
