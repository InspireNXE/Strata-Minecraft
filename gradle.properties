# Every property used in a mod metadata file must also be in the expandProps map in
# build-logic/src/main/groovy/strata-mc-java.gradle

# Project
version=0.1.0-SNAPSHOT
group=org.inspirenxe
java_version=25
junit_version=5.12.2
# The Strata version bundled into the mod jars; built from ../Strata until it is published
strata_version=0.1.0-SNAPSHOT

# Mod
minecraft_version=26.3
minecraft_version_range=[26.3, 26.4)
mod_id=strata
mod_name=Strata
mod_author=InspireNXE
license=MIT
description=Strata for Minecraft 26.3: an engine-agnostic GUI library with its NeoForge and Fabric adapter.
# The vanilla Minecraft that common compiles against, see https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1

# Fabric, see https://fabricmc.net/develop/
fabric_version=0.163.0+26.3
fabric_loader_version=0.19.5

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge
neoforge_version=26.3.0.83
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
