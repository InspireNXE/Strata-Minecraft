# Every property used in a mod metadata file must also be in the expandProps map in
# build-logic/src/main/groovy/strata-mc-java.gradle

# Project
version=0.1.0+1.21.1-SNAPSHOT
group=org.inspirenxe
java_version=21
junit_version=5.12.2
# The Strata version bundled into the mod jars; built from strataDir until it is published
strata_version=0.1.0-java17-SNAPSHOT
# The Strata checkout the build includes
strataDir=../Strata-java17

# Mod
minecraft_version=1.21.1
minecraft_version_range=[1.21.1, 1.21.2)
mod_id=strata
mod_name=Strata
mod_author=InspireNXE
license=Apache-2.0
description=Strata for Minecraft 1.21.1: an engine-agnostic GUI library with its NeoForge, Forge and Fabric adapter.
# The vanilla Minecraft that common compiles against, see https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430

# Fabric, see https://fabricmc.net/develop/
fabric_version=0.116.17+1.21.1
fabric_loader_version=0.19.5

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge
neoforge_version=21.1.264
neoforge_loader_version_range=[4,)

# Forge, see https://files.minecraftforge.net/net/minecraftforge/forge/
forge_version=52.1.20
forge_loader_version_range=[52,)

# Sponge, see https://repo.spongepowered.org/repository/maven-public/org/spongepowered/spongeapi/
# SpongeAPI 12 is the API of SpongeNeo and SpongeForge for 1.21.1.
sponge_api_version=12.0.0
sponge_api_version_range=[12.0.0,13)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
